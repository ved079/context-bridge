<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400" />
  <title>Context Bridge v5</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M4 12h4m8 0h4M12 4v4m0 8v4"/>
          </svg>
        </div>
        <span>Context Bridge</span>
      </div>
      <div class="version-badge">v5</div>
    </header>

    <!-- Status Card -->
    <div class="status-card" id="statusCard">
      <div class="status-icon" id="statusIcon"></div>
      <div class="status-info">
        <div class="status-title" id="statusTitle">Detecting...</div>
        <div class="status-subtitle" id="statusSubtitle">Checking active tab</div>
      </div>
    </div>

    <!-- Capture Button -->
    <div class="action-area">
      <button class="btn-capture" id="btnCapture" disabled>
        <span class="capture-icon" id="captureIcon">&#9889;</span>
        <span class="capture-text" id="captureText">Capture Conversation</span>
      </button>
      <div class="capture-hint" id="captureHint">Open a Claude, ChatGPT or Z.ai conversation first</div>
    </div>

    <!-- Results Panel (hidden until capture succeeds) -->
    <div class="results" id="resultsPanel" style="display:none;">
      <div class="results-header">
        <span class="results-label" id="resultsLabel">Captured</span>
        <span class="results-title" id="resultsTitle"></span>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-value" id="statMessages">0</span>
          <span class="stat-label">Messages</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statTools">0</span>
          <span class="stat-label">Tool Calls</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statWords">0</span>
          <span class="stat-label">Words</span>
        </div>
      </div>

      <!-- Export Buttons -->
      <div class="export-list">
        <button class="btn-export" id="btnExportMd">
          <span class="export-badge">MD</span>
          <div class="export-info">
            <span class="export-name">Full Markdown</span>
            <span class="export-desc">Headers, timestamps, tool calls</span>
          </div>
        </button>
        <button class="btn-export" id="btnExportCompact">
          <span class="export-badge">C</span>
          <div class="export-info">
            <span class="export-name">Compact Markdown</span>
            <span class="export-desc">Token-saving for pasting into AI</span>
          </div>
        </button>
        <button class="btn-export" id="btnExportJson">
          <span class="export-badge">{ }</span>
          <div class="export-info">
            <span class="export-name">JSON Backup</span>
            <span class="export-desc">Structured data with all tools</span>
          </div>
        </button>
      </div>

      <!-- Preview -->
      <div class="preview-box">
        <div class="preview-bar">
          <span class="preview-label">Preview</span>
          <button class="btn-toggle" id="btnTogglePreview">Show</button>
        </div>
        <div class="preview-content" id="previewContent" style="display:none;"></div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading" id="loadingOverlay" style="display:none;">
      <div class="spinner"></div>
      <span class="loading-text" id="loadingText">Fetching conversation...</span>
    </div>

    <!-- Error Panel -->
    <div class="error-box" id="errorBox" style="display:none;">
      <div class="error-icon">!</div>
      <div class="error-info">
        <div class="error-title">Capture Failed</div>
        <div class="error-msg" id="errorMsg"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Context Bridge v5 — Claude, ChatGPT &amp; Z.ai</span>
    </footer>
  </div>

  <script src="../lib/markdown-generator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
